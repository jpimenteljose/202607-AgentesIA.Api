services:

  pgvector:

    image: pgvector/pgvector:pg17

    container_name: api-rag-pgvector

    environment:
      POSTGRES_DB: bd_agenteia
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5435:5432"

    volumes:
      - pgvector_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bd_rag"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:

    image: dpage/pgadmin4:latest

    container_name: api-rag-pgadmin

    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin

    ports:
      - "5051:80"

    depends_on:
      pgvector:
        condition: service_healthy

    restart: unless-stopped

volumes:
  pgvector_data: